<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline</title>
<style>
  html,body{margin:0;height:100%;background:#0e2440;color:#fff;font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}
  h1{font-size:1.4rem;margin:0 0 .5rem}
  p{margin:0 0 1.5rem;opacity:.8}
  button{font:inherit;font-weight:600;background:#fff;color:#0e2440;border:0;padding:.85rem 1.6rem;min-height:48px;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>No connection</h1>
  <p>Nordic Affairs Media needs the internet. Check your connection and try again.</p>
  <button id="retry">Try again</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () {
    // Go back to the live site that failed to load, or reload this page.
    if (history.length > 1) history.back(); else location.reload();
  });
</script>
</body>
</html>
