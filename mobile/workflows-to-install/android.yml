name: Android – ticketing app + gate scanner

# Builds two separate Android apps from /mobile (Capacitor shells around the live website):
#   tickets → "Nordic Affairs"   (events, booking, My bookings, e-tickets)
#   gate    → "NAM Gate Scanner" (staff sign-in, camera QR scanner, live check-in counter)
# Without signing secrets it produces debug APKs (installable for testing).
# With the ANDROID_* secrets it produces signed release APKs + Play Store bundles (.aab).

on:
  push:
    branches: [main]
    tags: ['mobile-v*']
    paths: ['mobile/**', 'apps/web/public/icons/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'apps/web/public/icons/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      app:
        description: Which app to build
        type: choice
        options: [both, tickets, gate]
        default: both
      publish_play:
        description: Upload the signed bundle to the Google Play internal track
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [tickets, gate]
    env:
      APP_VARIANT: ${{ matrix.app }}
      SITE_URL: ${{ vars.SITE_URL || 'https://nordicaffairsmedia.com' }}
      BUNDLE_ID_BASE: ${{ vars.BUNDLE_ID_BASE || 'com.nordicaffairs.media' }}
      VERSION_NAME: ${{ vars.APP_VERSION || '1.0.0' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Skip apps that were not asked for
        id: want
        run: |
          pick="${{ github.event.inputs.app || 'both' }}"
          if [ "$pick" = both ] || [ "$pick" = "${{ matrix.app }}" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.want.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.want.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        if: steps.want.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.want.outputs.run == 'true'

      - name: Install, generate icons and the Android project
        if: steps.want.outputs.run == 'true'
        working-directory: mobile
        run: |
          npm ci
          npm run prepare:assets
          node scripts/native.mjs add android
          node scripts/native.mjs configure android

      - name: Decode signing key (only when secrets exist)
        if: steps.want.outputs.run == 'true'
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "NAM_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "NAM_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "NAM_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "NAM_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret – building an unsigned-for-store debug APK."
          fi

      - name: Build signed release (APK + AAB)
        if: steps.want.outputs.run == 'true' && steps.sign.outputs.signed == 'true'
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Build debug APK
        if: steps.want.outputs.run == 'true' && steps.sign.outputs.signed != 'true'
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK / AAB
        if: steps.want.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.app }}-${{ github.run_number }}
          if-no-files-found: error
          path: |
            mobile/android/app/build/outputs/apk/**/*.apk
            mobile/android/app/build/outputs/bundle/**/*.aab

      - name: Publish to Google Play (internal track)
        if: >-
          steps.want.outputs.run == 'true' && steps.sign.outputs.signed == 'true' &&
          (github.event.inputs.publish_play == 'true' || startsWith(github.ref, 'refs/tags/mobile-v'))
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ matrix.app == 'gate' && format('{0}.gate', env.BUNDLE_ID_BASE) || env.BUNDLE_ID_BASE }}
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
